# Runtime support policy (ADR B). `required` is what a release must qualify
# on before it advertises the surface; `status` is the evidence today.
#
# A runtime is advertised as supported only on a qualified record for the
# exact version and release lock. Claude Code has one for 0.1.0; the two
# other required surfaces are waived for this release, in writing, in
# .osp/qualification/, and are not advertised. The 0.1.0 record names the
# golden this package carried before the computations moved in under ADR
# E; the next release qualifies against the goldens named below.
schema_version: 1
surfaces:
  claude-code:
    role:
    - development
    - runtime
    required: true
    status: tested
    evidence: >-
      Qualified for 0.1.0 by a headless run of the full matrix on Claude Code from a release-candidate
      catalog, recorded in .osp/qualification/ at that version. Not qualified for 0.2.0: no run was
      made, because the release environment produced contradictory results for another capability in
      the same round and a record made there would say more about the environment than about this
      package. The goldens pass on the release commit and the release lock is current.
  claude-cowork:
    role: runtime
    required: true
    status: planned
    evidence: The Claude projection (.claude-plugin/plugin.json) is rendered from package.yaml and passes
      osp.py validate in the gate; no install of this capability from the marketplace has been verified,
      because the catalog entry is cut with the release
  openai-codex:
    role: runtime
    required: true
    status: planned
    evidence: The Agent Plugins projection (plugin.json) is rendered from package.yaml and passes osp.py
      plugin-check in the gate; Codex qualification of a release has not run
  claude-science:
    role: future-runtime
    required: false
    status: limited-release
qualification:
  require:
  - install
  - skill-discovery
  - skill-invocation
  - knowledge-resolution
  - dependency-resolution
  - golden-computation
  - prove
  - receipt
  - release-lock
probes:
  skill-invocation:
    skill: ice-mass-change
    prompt: Close the Greenland ice sheet's mass balance over 2003 through 2016 from the GRACE and GRACE-FO
      mascon sum against the altimetric volume change with its firn correction, and show me the plan before
      anything is run.
    # The expectation is the concept path and the window, which the skill
    # must state before any run: every number it can report is owned by the
    # computation concept this package carries, which the skill names by
    # package path, and the verdict belongs to the window, so a plan that
    # left the window out would be the failure worth catching.
    expect:
    - knowledge/computations/ice-sheet-balance[.]md
    - '2003'
  prove:
    prompt: 'Run this capability''s closure golden on its synthetic fixture and report the verdict and
      the residual it prints. The command is: uv run ${PLUGIN_ROOT}/verification/ice_sheet_balance.py
      --runtime ${RUNTIME} --out ${WORK}/receipt.json'
    receipt: ${WORK}/receipt.json
    command:
    - uv
    - run
    - ${PLUGIN_ROOT}/verification/ice_sheet_balance.py
    - --attest
    - ${WORK}/receipt.json
    - --out
    - ${WORK}/attestation.json
    attestation: ${WORK}/attestation.json
  golden-computation:
  - verification/ice_sheet_balance.py
  - verification/ice_sheet_input_output.py
