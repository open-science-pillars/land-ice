# Runtime support policy (ADR B). `required` is what a release must qualify
# on before it advertises the surface; `status` is the evidence today.
#
# A runtime is advertised as supported only on a qualified record for the
# exact version and release lock. Claude Code has one for 0.1.0; the two
# other required surfaces are waived for this release, in writing, in
# .osp/qualification/, and are not advertised.
schema_version: 1
surfaces:
  claude-code:
    role:
    - development
    - runtime
    required: true
    status: supported
    evidence: 'Qualified for 0.1.0 by a headless run of the full matrix on Claude Code from a release-candidate
      catalog, recorded in .osp/qualification/claude-code.json against the release lock: installed with both
      dependencies, both skills discovered and invoked, the golden green on the installed tree, and the prove
      receipt attested'
  claude-cowork:
    role: runtime
    required: true
    status: planned
    evidence: The Claude projection (.claude-plugin/plugin.json) is rendered from package.yaml and passes
      osp.py validate in the gate; no install of this capability from the marketplace has been verified,
      because the catalog entry is cut with the release
  openai-codex:
    role: runtime
    required: true
    status: planned
    evidence: The Agent Plugins projection (plugin.json) is rendered from package.yaml and passes osp.py
      plugin-check in the gate; Codex qualification of a release has not run
  claude-science:
    role: future-runtime
    required: false
    status: limited-release
qualification:
  require:
  - install
  - skill-discovery
  - skill-invocation
  - knowledge-resolution
  - dependency-resolution
  - golden-computation
  - prove
  - receipt
  - release-lock
probes:
  skill-invocation:
    skill: ice-mass-change
    prompt: Close the Greenland ice sheet's mass balance over 2003 through 2016 from the GRACE and GRACE-FO
      mascon sum against the altimetric volume change with its firn correction, and show me the plan before
      anything is run.
    # The sibling capabilities expect their own package name here, because a
    # skill that computes something says whose computation it is. A wrapping
    # skill does the opposite on purpose: every number it can report is owned
    # by a concept in the provider bundle, and the skill names that concept by
    # bundle path and never claims it. So the expectation is the concept path
    # and the window, which the skill must state before any run, because the
    # verdict belongs to the window and a plan that left it out would be the
    # failure worth catching.
    expect:
    - knowledge/nsidc/computations/ice-sheet-balance[.]md
    - '2003'
  prove:
    prompt: 'Run this capability''s wrapping golden on the provider bundle''s synthetic fixture and report
      the verdict and the residual it prints. The command is: uv run ${PLUGIN_ROOT}/verification/wrapped_computations.py
      --runtime ${RUNTIME} --out ${WORK}/receipt.json'
    receipt: ${WORK}/receipt.json
    command:
    - uv
    - run
    - ${PLUGIN_ROOT}/verification/wrapped_computations.py
    - --attest
    - ${WORK}/receipt.json
    - --out
    - ${WORK}/attestation.json
    attestation: ${WORK}/attestation.json
  golden-computation:
  - verification/wrapped_computations.py
