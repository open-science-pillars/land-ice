# Package identity, content, dependencies, presentation metadata and
# connectors (ADR B). The Claude package files and the Agent Plugins
# package are rendered from this file by build-kit's osp.py render; the
# gate fails on a hand edit to any of them.
#
# A computation is a skill (ADR E): the content is the skills, the two
# attested computation concepts this capability owns with their stamped
# data roots, and the goldens that prove the scripts each concept names.
# The dataset, gotcha and recipe concepts the two computations rest on
# stay in the provider bundle and arrive with the nasa-daac-knowledge
# dependency, never as a copy, so the floor below is a floor on those
# products and on nothing this capability runs.
schema_version: 1
package:
  name: land-ice
  version: 0.1.0
  type: capability
content:
  skills: ./skills
  knowledge: ./knowledge
  verification: ./verification
dependencies:
  capabilities:
  - name: core
  knowledge:
  - name: nasa-daac-knowledge
    version: '>=2026.9.4'
metadata:
  description: 'Land ice: the two attested ice sheet mass balance computations, the gravimetry against
    altimetry closure and the input-output balance through a flux gate set, with the skills that run them,
    the stamped data roots they read and the goldens that prove them.'
  keywords:
  - land-ice
  - cryosphere
  - ice-sheet
  - mass-balance
  - greenland
  - antarctica
  - grace-fo
  - mascons
  - altimetry
  - firn
  - input-output
  - flux-gate
  - attested-computation
