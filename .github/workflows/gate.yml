name: gate
# The planned repository's gate: the canonical metadata validates, nothing
# installable exists (osp.py validate refuses a package, surfaces file,
# runtime manifest, skills tree, release marker or CITATION.cff for a
# repository whose status is planned), and the prose keeps the
# organization's wording rules. The checkers are build-kit's and the
# knowledge repository's tools, checked out beside this repository the way
# a developer's workspace holds them; nothing is copied.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: repo
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: open-science-pillars/build-kit
          path: build-kit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: open-science-pillars/nasa-daac-knowledge
          path: nasa-daac-knowledge
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Canonical metadata validates and nothing installable exists
        run: uv run ../build-kit/scripts/osp.py validate . --standalone
      - name: Wording rules (no dashes, no program bookkeeping, rules by name)
        run: uv run ../nasa-daac-knowledge/tools/check_prose.py .
