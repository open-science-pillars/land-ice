name: plugin gate
# The per-plugin gate, in the shape the template carries: the manifest
# validates, the canonical metadata validates and the projections are
# rendered from it rather than edited, the portable package conforms to
# Agent Plugins, the local knowledge bundle conforms to OKF v0.2, every
# script's PEP 723 header covers what it imports (so `uv run <script>`
# resolves on any machine), the README's runtime table is current, and the
# signature debt is measured. The checkers are the canonical knowledge
# repository's tools and build-kit's, checked out beside the plugin the
# way a developer's workspace holds them; nothing is copied.
#
# Where the code of a computation lives is measured by the validate step
# already listed, which carries the two findings of ADR E: nothing runnable under
# knowledge/, and a computation's executor and attester resolving inside
# this package with a golden under verification/ naming each. There is no
# separate step for it.
#
# Signature debt (the merge-then-sign rule) is reported on pull requests
# and on main, where a concept may owe a signature between a merge and
# its re-sign, and enforced on a release tag, which must owe none.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['land-ice--v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: plugin
          fetch-depth: 0   # signature_check reads the signing commits
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: open-science-pillars/nasa-daac-knowledge
          path: nasa-daac-knowledge
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: open-science-pillars/build-kit
          path: build-kit
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install the Claude Code CLI (the manifest validator)
        working-directory: ${{ github.workspace }}
        run: npm install -g @anthropic-ai/claude-code@2.1.252
      - name: Manifest validates
        run: claude plugin validate .
      - name: Canonical metadata validates and the manifest agrees with it
        run: uv run ../build-kit/scripts/osp.py validate . --standalone
      - name: Runtime projections are rendered from package.yaml, not hand-edited
        run: uv run ../build-kit/scripts/osp.py render . --check
      - name: The portable package conforms to Agent Plugins 1.0.0
        run: uv run ../build-kit/scripts/osp.py plugin-check .
      - name: A runtime is advertised only on a qualified record; the README's runtime table is current
        run: uv run ../build-kit/scripts/osp.py advertise . --check --into README.md
      - name: Release lock, reported (content may move between releases)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv run ../build-kit/scripts/osp.py lock . --report
      - name: Release lock, enforced (a release tag digests to its lock)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv run ../build-kit/scripts/osp.py lock . --check
      - name: Bundle conforms to OKF v0.2
        run: uv run ../nasa-daac-knowledge/tools/check_okf_v02.py knowledge
      - name: Every script declares the dependencies it imports
        run: uv run ../nasa-daac-knowledge/tools/check_script_deps.py .
      - name: Wording rules (specification rules by name, no program bookkeeping, no dashes)
        run: uv run ../nasa-daac-knowledge/tools/check_prose.py .
      - name: Signature debt, reported (main may owe between a merge and its re-sign)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv run ../nasa-daac-knowledge/tools/signature_check.py knowledge --report
      - name: Signature debt, enforced (a release tag owes nothing)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv run ../nasa-daac-knowledge/tools/signature_check.py knowledge
